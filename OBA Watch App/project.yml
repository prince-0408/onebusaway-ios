targets:
  OBAWatchApp:
    type: application
    platform: watchOS
    sources: 
      - path: .
        excludes:
          - "Assets.xcassets"
    entitlements:
      path: OBA Watch App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.onebusaway.iphone
    info:
      path: OBAWatch-AppInfo.plist
      properties:
        CFBundleDisplayName: OneBusAway
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.onebusaway.iphone
        NSLocationWhenInUseUsageDescription: See nearby transit stops and schedules based on your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: See nearby transit stops and schedules based on your location.
        OBAKitConfig:
          AppGroup: group.org.onebusaway.iphone
          RESTServerAPIKey: org.onebusaway.iphone
    settings:
      base:
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.onebusaway.iphone.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        I_PHONE_OS_DEPLOYMENT_TARGET: "18.0"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.onebusaway.iphone
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
    dependencies:
      - target: OBAKitCore
        embed: true
      - target: OBAWatchComplication
        embed: true

  OBAWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: ../OBAWatchComplication
    entitlements:
      path: ../OBAWatchComplication/OBAWatchComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.onebusaway.iphone
    info:
      path: ../OBAWatchComplication/Info.plist
      properties:
        CFBundleDisplayName: OBA Arrivals
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        OBAKitConfig:
          AppGroup: group.org.onebusaway.iphone
          RESTServerAPIKey: org.onebusaway.iphone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.onebusaway.iphone.watchkitapp.complication
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        CODE_SIGN_IDENTITY: "iPhone Developer"
        DEVELOPMENT_TEAM: 4ZQCMA634J
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
    dependencies:
      - target: OBAKitCore

