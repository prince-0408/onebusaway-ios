targets:
  OBAWatchApp:
    type: application
    platform: watchOS
    sources: 
      - path: .
        excludes:
          - "Assets.xcassets"
          - "OBAWatch-AppInfo.plist"
          - "OBA Watch App.entitlements"
    settings:
      base:
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.onebusaway.iphone.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        I_PHONE_OS_DEPLOYMENT_TARGET: "18.0"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.onebusaway.iphone
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
    dependencies:
      # OBAKitCore is embedded here (the Watch app container) and shared with the extension.
      - target: OBAKitCore
        embed: true

